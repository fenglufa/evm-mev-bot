[dev-dependencies]
evm-execution.workspace = true
evm-graph.workspace = true
evm-metrics.workspace = true
evm-opportunity.workspace = true
# A dev-dependency, not a production one: §37 states the end-to-end chain as beginning at a
# `CycleCandidate`, so the fixture that walks it asks the search layer for its input rather than
# hand-writing an edge list. Nothing in this crate's library reaches the topology layer, and
# `evm-pathfinder` links no transport, so no test here gains an RPC it was not already making.
evm-pathfinder.workspace = true
# The interval analyzer the concurrency fixture reads its overlap figures from lives in
# the layer above this crate. A dev-dependency cycle is legal here — building
# `evm-pipeline` needs this crate's library, never its tests — and it is what keeps M8.3.3
# §14's rule honest: the fixture computes `rpc_union_duration_ns` and `max_concurrency`
# with the same function that produced M8.3.2's committed tables, so a difference between
# a fixture and a live run cannot be an arithmetic difference.
evm-pipeline.workspace = true
evm-replay.workspace = true
evm-risk.workspace = true
evm-state.workspace = true
tokio.workspace = true
